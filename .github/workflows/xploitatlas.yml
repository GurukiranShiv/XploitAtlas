name: XploitAtlas validation
on:
  push:
    branches: [main, codex/xploitatlas-clean-download]
  pull_request:
  workflow_dispatch:
    inputs:
      live_sources:
        description: Fetch real upstream sources in opt-in integration tests
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: xploitatlas-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check Python and JavaScript syntax
        run: |
          python3 -m compileall -q .
          node --check static/app.js
          node --check static/universe.js
          node --check static/ui.js
      - name: Test boundaries, frontend helpers, and complete downloads
        run: |
          node --test tests/ui.test.js
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check the standalone archive
        run: |
          python3 source_package.py --output ../XploitAtlas-source.zip
          python3 tests/verify_archive.py ../XploitAtlas-source.zip
  windows-launcher:
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Test Python startup and source-download completeness
        run: |
          python -E start.py --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -E -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check automatic selection with invalid Python environment overrides
        run: |
          $env:PYTHONHOME = Join-Path $env:RUNNER_TEMP 'xploitatlas-missing-python-home'
          $env:PYTHONPATH = Join-Path $env:RUNNER_TEMP 'xploitatlas-missing-python-path'
          & .\START_WINDOWS.bat --check-python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\START_WINDOWS.bat --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path .\runtime) { throw 'Diagnostic commands must not create runtime data.' }
      - name: Check extraction and Windows launching from a different directory
        run: |
          $downloadCheck = Join-Path $env:RUNNER_TEMP 'XploitAtlas download test (spaces)!'
          New-Item -ItemType Directory -Path $downloadCheck | Out-Null
          $archivePath = Join-Path $downloadCheck 'XploitAtlas-source.zip'
          python -E source_package.py --output $archivePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -E tests/verify_archive.py $archivePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive $archivePath -DestinationPath $downloadCheck
          & (Join-Path $downloadCheck 'XploitAtlas\START_WINDOWS.bat') --check-python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $downloadCheck 'XploitAtlas\START_WINDOWS.bat') --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check a launcher without its required application reports the problem
        run: |
          $launcherCheck = Join-Path $env:RUNNER_TEMP 'XploitAtlas launcher without source'
          New-Item -ItemType Directory -Path $launcherCheck | Out-Null
          Copy-Item .\START_WINDOWS.bat -Destination $launcherCheck
          & (Join-Path $launcherCheck 'START_WINDOWS.bat') --check-python
          if ($LASTEXITCODE -ne 1) { throw 'Missing start.py must report an error.' }
          exit 0
  live-sources:
    if: github.event_name == 'workflow_dispatch' && inputs.live_sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check real upstream feeds without substitute data
        env:
          VULNORBIT_LIVE_TESTS: '1'
        run: python3 -m unittest discover -s tests -p test_live.py -v
