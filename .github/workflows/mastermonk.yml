name: MasterMonk verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_sources:
        description: Check the project's actual dependency manifest with live CISA and OSV
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Verify source, launcher, empty startup, and the extracted download
        run: python -E tools/verify.py
  real-dependencies:
    if: github.event_name == 'workflow_dispatch' && inputs.live_sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -E tools/verify.py --live
