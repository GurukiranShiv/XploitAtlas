name: VulnOrbit validation
on:
  push:
    branches: [codex/vulnorbit-live-universe, main]
    paths: ["vulnorbit/**", "vulnorbit-source.zip", ".github/workflows/vulnorbit.yml"]
  pull_request:
    paths: ["vulnorbit/**", "vulnorbit-source.zip", ".github/workflows/vulnorbit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vulnorbit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Compile Python and check JavaScript syntax
        run: |
          python3 --version
          node --version
          python3 -m compileall -q .
          node --check static/app.js
          node --check static/universe.js
          node --check static/ui.js
      - name: Validate presentation and input boundaries
        run: |
          node --test tests/ui.test.js
          python3 -m unittest discover -s tests -p test_core.py -v
      - name: Validate real sources, persistence, HTTP, and export
        env:
          VULNORBIT_LIVE_TESTS: "1"
        run: python3 -m unittest discover -s tests -p test_live.py -v
      - name: Verify standalone download when present
        run: |
          python3 -c "from pathlib import Path; import zipfile; p=Path('../vulnorbit-source.zip'); z=zipfile.ZipFile(p) if p.exists() else None; assert z is None or z.testzip() is None"
